name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # A PAT, not GITHUB_TOKEN, so the release PR triggers CI.
          token: ${{ secrets.RELEASE_TOKEN }}

  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --os '*' --cpu '*' --libc '*'
      - run: bun run typecheck
      - run: bun run test
      - run: bun scripts/build.ts
      - name: Package
        run: |
          cd dist
          for dir in */; do
            target="${dir%/}"
            tar -czf "qcs-${target}.tar.gz" -C "$target" qcs
          done
          sha256sum qcs-*.tar.gz > SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload --clobber "$TAG_NAME" dist/qcs-*.tar.gz dist/SHA256SUMS
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAP_REPOSITORY: nicosantux/homebrew-tap
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          formula=packaging/homebrew/qcs.rb
          for archive in dist/qcs-*.tar.gz; do
            name="$(basename "$archive")"
            hash="$(grep " ${name}$" dist/SHA256SUMS | cut -d' ' -f1)"
            sed -i "s/REPLACE_WITH_SHA256_OF_${name}/${hash}/" "$formula"
          done
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" tap
          mkdir -p tap/Formula
          cp "$formula" tap/Formula/qcs.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/qcs.rb
          git diff --cached --quiet || { git commit -m "qcs ${TAG_NAME}" && git push; }
