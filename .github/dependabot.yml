version: 2
updates:
  # Bun has no prefix-development, so every bump is chore(deps). Retitle a runtime bump to fix(deps) to ship it in a release.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
